name: Deploy to Amazon ECS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: cloud-images
  ECS_CLUSTER: cloud-images-cluster
  ECS_SERVICE: cloud-images-service
  ECS_TASK_DEFINITION: task-definition.json
  CONTAINER_NAME: cloud-images

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC claims
        uses: github/actions-oidc-debugger@main
        with:
          audience: sts.amazonaws.com

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::750906968747:role/GitHubActionsCloudImagesPolicy
          aws-region: ${{ env.AWS_REGION }}
