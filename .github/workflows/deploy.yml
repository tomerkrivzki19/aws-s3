name: Deploy to Amazon ECS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: cloud-images
  ECS_CLUSTER: cloud-images-cluster
  ECS_SERVICE: cloud-images-service
  ECS_TASK_DEFINITION: task-definition.json
  CONTAINER_NAME: cloud-images

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show GitHub OIDC claims
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = (
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
              + "&audience=sts.amazonaws.com"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization":
                      "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              }
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          encoded_payload = token.split(".")[1]
          encoded_payload += "=" * (-len(encoded_payload) % 4)

          payload = json.loads(
              base64.urlsafe_b64decode(encoded_payload).decode()
          )

          safe_claims = {
              key: payload.get(key)
              for key in [
                  "iss",
                  "aud",
                  "sub",
                  "repository",
                  "repository_id",
                  "repository_owner",
                  "repository_owner_id",
                  "ref"
              ]
          }

          print(json.dumps(safe_claims, indent=2))
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::750906968747:role/GitHubActionsCloudImagesPolicy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Render ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
